name: Deploy Backend to Staging (Free Tier EC2)

on:
  push:
    branches: [ staging ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-staging.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy backend files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_EC2_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.STAGING_EC2_SSH_PRIVATE_KEY }}
          source: "backend/**,!backend/node_modules/**"
          target: "/home/ubuntu/app/staging"

      - name: SSH into EC2 and restart Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_EC2_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.STAGING_EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/app/staging/backend
            
            # Debug: List files to verify SCP worked
            ls -la
            
            # Create the .env file dynamically from GitHub Secrets
            echo "NODE_ENV=staging" > .env
            echo "PORT=8080" >> .env
            echo "DB_HOST=${{ secrets.STAGING_DB_HOST }}" >> .env
            echo "DB_USER=${{ secrets.STAGING_DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}" >> .env
            echo "DB_NAME=${{ secrets.STAGING_DB_NAME }}" >> .env
            echo "ACCESS_TOKEN_SECRET=${{ secrets.STAGING_ACCESS_TOKEN_SECRET }}" >> .env
            echo "REFRESH_TOKEN_SECRET=${{ secrets.STAGING_REFRESH_TOKEN_SECRET }}" >> .env
            echo "RAZORPAY_KEY_ID=${{ secrets.STAGING_RAZORPAY_KEY_ID }}" >> .env
            echo "RAZORPAY_KEY_SECRET=${{ secrets.STAGING_RAZORPAY_KEY_SECRET }}" >> .env
            echo "CRON_SECRET=${{ secrets.STAGING_CRON_SECRET }}" >> .env
            echo "AWS_REGION=${{ secrets.STAGING_AWS_REGION }}" >> .env
            echo "AWS_S3_BUCKET=${{ secrets.STAGING_UPLOADS_BUCKET_NAME }}" >> .env
            echo "AWS_ACCESS_KEY_ID=${{ secrets.STAGING_BACKEND_S3_ACCESS_KEY }}" >> .env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.STAGING_BACKEND_S3_SECRET_KEY }}" >> .env
            
            # Rebuild and restart the container
            docker compose down
            docker compose up -d --build
            
            # Clean up dangling images to save disk space on the small EC2 instance
            docker image prune -f
