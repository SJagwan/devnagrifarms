version: '3.8'

services:
  staging_api:
    build: .
    container_name: devnagrifarms_staging_api
    ports:
      - "80:8080"
    restart: always
    environment:
      - NODE_ENV=staging
      - PORT=8080
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=devnagrifarms_staging
      - JWT_SECRET=${JWT_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      # Add other staging environment variables here